name: Generate Snake & Trophies

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Генерируем Змейку
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Генерируем Трофеи напрямую через Deno (без внешних серверов и Vercel)
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.44.4

      - name: Generate Trophies SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy
          cd /tmp/trophy
          deno run --allow-all api/index.ts &
          SERVER_PID=$!
          sleep 3
          curl -s "http://localhost:8080/?username=${{ github.repository_owner }}&theme=onedark&no-frame=false&no-bg=true&margin-w=4&row=1" -o $GITHUB_WORKSPACE/dist/trophies.svg
          kill $SERVER_PID

      # 3. Сохраняем и Змейку, и Трофеи в ветку output
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
