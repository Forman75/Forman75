name: Generate Snake & Trophies

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Генерируем Змейку
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Устанавливаем Deno
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.44.4

      # 3. Генерируем Трофеи напрямую в файл без веб-сервера и curl
      - name: Generate Trophies SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ github.workspace }}/dist/trophies.svg
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy
          cd /tmp/trophy

          cat << 'EOF' > render.ts
          import handler from "./api/index.ts";

          const user = Deno.env.get("GH_USER") || "Forman75";
          const outPath = Deno.env.get("OUTPUT_FILE")!;

          const req: any = {
            url: `/?username=${user}&theme=onedark&no-frame=false&no-bg=true&margin-w=4&row=1`,
            headers: new Headers({ host: "localhost" }),
            respond: async (res: { body: string | Uint8Array }) => {
              const svg = typeof res.body === "string"
                ? res.body
                : new TextDecoder().decode(res.body);
              await Deno.writeTextFile(outPath, svg);
            },
          };

          await handler(req);
          EOF

          deno run --no-check --allow-all render.ts

      # 4. Сохраняем и Змейку, и Трофеи в ветку output
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
